name: Build Cold Reading APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-reading-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.coldreading --project-name cold_reading .
          # Drop template files that don't apply to this app.
          rm -f test/widget_test.dart analysis_options.yaml
          sed -i 's/android:label="[^"]*"/android:label="Cold Reading"/' android/app/src/main/AndroidManifest.xml

      - name: Sign every build with the same key
        # A fixed key lets new versions install over old ones on the phone.
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'GRADLE'

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("../../signing/app.keystore")
                      storeType = "pkcs12"
                      storePassword = "android"
                      keyAlias = "mindhunter"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          GRADLE
          else
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../signing/app.keystore")
                      storeType "pkcs12"
                      storePassword "android"
                      keyAlias "mindhunter"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Test curriculum
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ColdReading.apk
          # Fail the build if the APK isn't signed with the fixed key.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ColdReading.apk | grep -q "CN=MindHunter Academy"

      - uses: actions/upload-artifact@v4
        with:
          name: ColdReading-apk
          path: ColdReading.apk
          retention-days: 30

  install-test:
    # Proves the APK installs and launches on a real Android system image.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ColdReading-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r ColdReading.apk
            adb shell monkey -p com.coldreading.cold_reading -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.coldreading.cold_reading
